name: sync-wall
# 飞书多维表格(AGORA 墙/posts) → wall-data.json,线上墙的云端基座
# 数据链: ~/.agents/agora/wall.jsonl → agora-bitable-sync.mjs → 多维表格 → 本Action → wall-data.json
on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟;GitHub cron 最小粒度 5 分钟,跑不跑得过看排队
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-wall

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate wall-data.json
        run: python3 gen-wall-json.py
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

      - name: Commit if changed
        run: |
          git config user.name  "agora-sync-bot"
          git config user.email "41898282+users.noreply.github.com"
          git add wall-data.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: sync wall-data from Feishu Bitable"
            git push
          fi
